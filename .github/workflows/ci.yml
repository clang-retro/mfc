# Builds the libraries and runs the tests under Wine, twice:
#
# - clang-dos: with clang-retro's own toolchain (the nightly package from
#   clang-retro/dos-sdk, which is rebuilt every night from the default
#   branches) and its Windows 2000/XP sysroot with libc++.
# - mingw-wine: with the nightly's clang and Ubuntu's MinGW-w64 headers,
#   libraries and GCC libstdc++ (in place of libc++).
name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.docs/**', 'mkdocs.yml', 'clang-retro-docs/**', '.github/workflows/docs.yml', '.github/workflows/clang-retro-docs.yml', 'LICENSE*']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.docs/**', 'mkdocs.yml', 'clang-retro-docs/**', '.github/workflows/docs.yml', '.github/workflows/clang-retro-docs.yml', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-dos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Wine, Xvfb and the rest come from a cache of their installed files
      # (tools/ci-install.sh), so a run with one skips apt altogether. The key
      # names the package list, the script and the runner image; bump the
      # number to start a fresh cache.
      - name: Find the package cache key
        id: pkg-key
        env:
          PKGS: wine wine32:i386 xvfb xauth imagemagick python3
        run: |
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"
          echo "key=pkgs-dos-v1-$ImageOS-$ImageVersion-$(echo "$PKGS" | sha256sum | cut -c1-12)-${{ hashFiles('tools/ci-install.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the package cache
        id: pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/pkg-cache
          key: ${{ steps.pkg-key.outputs.key }}
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Install Wine and Xvfb
        timeout-minutes: 25
        run: sh tools/ci-install.sh ~/pkg-cache ${{ steps.pkg-key.outputs.pkgs }}
      - name: Save the package cache
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/pkg-cache
          key: ${{ steps.pkg-key.outputs.key }}
      - name: Find the Wine version
        id: wine
        run: echo "version=$(wine --version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Wine prefix
        uses: actions/cache@v4
        with:
          path: ~/wineprefix
          key: wineprefix-v1-${{ runner.os }}-${{ steps.wine.outputs.version }}
      - name: Build
        run: make -j"$(nproc)" BIN="$CLANG_DOS/bin" SYSROOT="$CLANG_DOS/sysroots/win2k-xp"
      # WTL's headers, kept per fetch-wtl.sh (which names the version).
      - name: Restore WTL
        id: wtl-cache
        uses: actions/cache/restore@v4
        with:
          path: build/wtl
          key: wtl-v1-${{ hashFiles('tools/fetch-wtl.sh') }}
      - name: Fetch WTL (for wtltest)
        run: sh tools/fetch-wtl.sh
      - name: Save WTL
        if: steps.wtl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/wtl
          key: wtl-v1-${{ hashFiles('tools/fetch-wtl.sh') }}
      - name: Test
        run: |
          export MFC_TEST_WINEPREFIX="$HOME/wineprefix"
          make check BIN="$CLANG_DOS/bin" SYSROOT="$CLANG_DOS/sysroots/win2k-xp"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-clang-dos
          path: |
            build/i586-pc-windows5.1-gnu/tests/a
            build/i586-pc-windows5.1-gnu/tests/u

  mingw-wine:
    runs-on: ubuntu-24.04
    # A hung package install or test should fail, not run for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Wine, Xvfb and the rest come from a cache of their installed files
      # (tools/ci-install.sh), so a run with one skips apt altogether. The key
      # names the package list, the script and the runner image; bump the
      # number to start a fresh cache.
      - name: Find the package cache key
        id: pkg-key
        env:
          PKGS: g++-mingw-w64-i686-posix wine wine32:i386 xvfb xauth imagemagick python3
        run: |
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"
          echo "key=pkgs-mingw-v1-$ImageOS-$ImageVersion-$(echo "$PKGS" | sha256sum | cut -c1-12)-${{ hashFiles('tools/ci-install.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the package cache
        id: pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/pkg-cache
          key: ${{ steps.pkg-key.outputs.key }}
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Install MinGW-w64, Wine and Xvfb
        timeout-minutes: 25
        run: sh tools/ci-install.sh ~/pkg-cache ${{ steps.pkg-key.outputs.pkgs }}
      - name: Save the package cache
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/pkg-cache
          key: ${{ steps.pkg-key.outputs.key }}
      # The Wine prefix takes a while to create; keep it too, per Wine version.
      - name: Find the Wine version
        id: wine
        run: echo "version=$(wine --version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Wine prefix
        uses: actions/cache@v4
        with:
          path: ~/wineprefix
          key: wineprefix-v1-${{ runner.os }}-${{ steps.wine.outputs.version }}
      - name: Build
        run: make -j"$(nproc)" TARGET=i686-w64-mingw32 STDLIB= BIN="$CLANG_DOS/bin"
      # WTL's headers, kept per fetch-wtl.sh (which names the version).
      - name: Restore WTL
        id: wtl-cache
        uses: actions/cache/restore@v4
        with:
          path: build/wtl
          key: wtl-v1-${{ hashFiles('tools/fetch-wtl.sh') }}
      - name: Fetch WTL (for wtltest)
        run: sh tools/fetch-wtl.sh
      - name: Save WTL
        if: steps.wtl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/wtl
          key: wtl-v1-${{ hashFiles('tools/fetch-wtl.sh') }}
      - name: Test
        run: |
          export MFC_TEST_WINEPREFIX="$HOME/wineprefix"
          make check TARGET=i686-w64-mingw32 STDLIB= BIN="$CLANG_DOS/bin" \
            TEST_RC="$CLANG_DOS/bin/llvm-windres" LDFLAGS="-static -lpthread"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            build/i686-w64-mingw32/tests/a
            build/i686-w64-mingw32/tests/u

  # Linux and macOS: the libraries over the portable Win32 layer (port/),
  # built with the runner's own clang, and the tests it can run so far.
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # odbctest's driver manager and SQLite driver.
      - name: Install unixODBC and the SQLite driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc libsqliteodbc
      - name: Build
        run: make -j"$(nproc)" TARGET=x86_64-linux-gnu STDLIB= AR=ar
      - name: Fetch WTL (for wtltest)
        run: sh tools/fetch-wtl.sh
      - name: Test
        env:
          MFC_TEST_ODBC: 1
        run: make check TARGET=x86_64-linux-gnu STDLIB= AR=ar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-native-linux
          path: |
            build/x86_64-linux-gnu/tests/a
            build/x86_64-linux-gnu/tests/u

  native-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # odbctest's driver manager and SQLite driver; without them it skips.
      - name: Install unixODBC and the SQLite driver
        run: |
          if brew install unixodbc sqliteodbc; then
            echo "MFC_TEST_ODBC=1" >> "$GITHUB_ENV"
            echo "MFC_TEST_ODBC_DRIVER=$(brew --prefix)/lib/libsqlite3odbc.dylib" >> "$GITHUB_ENV"
          else
            echo "::warning::no unixODBC or SQLite driver; odbctest skips"
          fi
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" TARGET=arm64-apple-macos11 STDLIB= AR=ar
      - name: Fetch WTL (for wtltest)
        run: sh tools/fetch-wtl.sh
      - name: Test
        run: make check TARGET=arm64-apple-macos11 STDLIB= AR=ar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-native-macos
          path: |
            build/arm64-apple-macos11/tests/a
            build/arm64-apple-macos11/tests/u

  # Mac OS X 10.4 on PowerPC and Intel: builds the libraries against the
  # macosx10.4 sysroot of the nightly (libc++ and the builtins) and Apple's
  # MacOSX10.4u.sdk. This libc++ does not declare std::abs and other
  # functions through unrelated headers, so the job finds a missing
  # #include that the native builds do not find. It does not link or run
  # programs: that needs Apple's ld64 and a Mac OS X guest.
  cross-macosx:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [i386, powerpc]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      # Adds the sysroot and Apple's SDK as $CLANG_DOS/macosx10.4.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
        with:
          sysroots: macosx10.4
          path: ${{ runner.temp }}/clang-dos
      - name: Build
        run: |
          s="$CLANG_DOS/macosx10.4"
          make -j"$(nproc)" TARGET=${{ matrix.arch }}-apple-macosx10.4 BIN="$CLANG_DOS/bin" \
            SDK="$s/MacOSX10.4u.sdk" LIBCXX="$s" AR="$CLANG_DOS/bin/llvm-ar" static
