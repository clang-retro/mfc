# Builds the libraries and runs the tests under Wine, twice:
#
# - clang-dos: with clang-retro's own toolchain (the nightly package from
#   clang-retro/dos-sdk, which is rebuilt every night from the default
#   branches) and its Windows 2000/XP sysroot with libc++.
# - mingw-wine: with the nightly's clang and Ubuntu's MinGW-w64 headers,
#   libraries and GCC libstdc++ (in place of libc++).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-dos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Install Wine and Xvfb
        timeout-minutes: 15
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 xvfb xauth imagemagick python3
      - name: Find the Wine version
        id: wine
        run: echo "version=$(wine --version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Wine prefix
        uses: actions/cache@v4
        with:
          path: ~/wineprefix
          key: wineprefix-v1-${{ runner.os }}-${{ steps.wine.outputs.version }}
      - name: Build
        run: make -j"$(nproc)" BIN="$CLANG_DOS/bin" SYSROOT="$CLANG_DOS/sysroots/win2k-xp"
      - name: Test
        run: |
          export MFC_TEST_WINEPREFIX="$HOME/wineprefix"
          make check BIN="$CLANG_DOS/bin" SYSROOT="$CLANG_DOS/sysroots/win2k-xp"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-clang-dos
          path: |
            build/i586-pc-windows5.1-gnu/tests/a
            build/i586-pc-windows5.1-gnu/tests/u

  mingw-wine:
    runs-on: ubuntu-24.04
    # A hung package install or test should fail, not run for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The packages' .debs are cached between runs, so an install only
      # downloads what changed. The key names the package list; bump the
      # number to start a fresh cache.
      - name: Restore the package cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-v1-${{ runner.os }}-
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Install MinGW-w64, Wine and Xvfb
        timeout-minutes: 15
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          if [ -d ~/apt-cache ]; then
            sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-i686-posix wine wine32:i386 xvfb xauth imagemagick python3
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
      - name: Save the package cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      # The Wine prefix takes a while to create; keep it too, per Wine version.
      - name: Find the Wine version
        id: wine
        run: echo "version=$(wine --version)" >> "$GITHUB_OUTPUT"
      - name: Restore the Wine prefix
        uses: actions/cache@v4
        with:
          path: ~/wineprefix
          key: wineprefix-v1-${{ runner.os }}-${{ steps.wine.outputs.version }}
      - name: Build
        run: make -j"$(nproc)" TARGET=i686-w64-mingw32 STDLIB= BIN="$CLANG_DOS/bin"
      - name: Test
        run: |
          export MFC_TEST_WINEPREFIX="$HOME/wineprefix"
          make check TARGET=i686-w64-mingw32 STDLIB= BIN="$CLANG_DOS/bin" \
            TEST_RC="$CLANG_DOS/bin/llvm-windres" LDFLAGS="-static -lpthread"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            build/i686-w64-mingw32/tests/a
            build/i686-w64-mingw32/tests/u
